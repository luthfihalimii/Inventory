services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-ent_inventory}
            POSTGRES_USER: ${DB_USERNAME:-ent_inventory}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-ent_inventory}
        ports:
            - '5433:5432'
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-ent_inventory}']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata:
